<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dispatcher-arch-title dispatcher-arch-desc" class="diagram">
    <title id="dispatcher-arch-title">Family Planning dispatcher architecture</title>
    <desc id="dispatcher-arch-desc">A dispatcher routes the utterance to a node in a defined journey graph, which produces an LLM-generated response for that step. There is no retrieval step.</desc>
    <defs>
        <marker id="dispatcher-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
        </marker>
    </defs>

    <g fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="8" y="44" width="88" height="32" />
        <rect x="152" y="44" width="120" height="32" />
        <rect x="328" y="44" width="140" height="32" />
        <rect x="540" y="44" width="92" height="32" />
    </g>

    <g font-family="var(--font-mono, monospace)" font-size="12" text-anchor="middle" fill="currentColor">
        <text x="52" y="64">Query</text>
        <text x="212" y="64">Dispatcher</text>
        <text x="398" y="64">Journey graph node</text>
        <text x="586" y="64">Response</text>
    </g>

    <g stroke="currentColor" stroke-width="1.5" marker-end="url(#dispatcher-arrow)">
        <path d="M96,60 L152,60" fill="none" />
        <path d="M272,60 L328,60" fill="none" />
        <path d="M468,60 L540,60" fill="none" />
    </g>

    <text x="320" y="128" font-family="var(--font-mono, monospace)" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">Evaluated: journey routing integrity, response quality — not retrieval</text>
</svg>
