<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="snippets-arch-title snippets-arch-desc" class="diagram">
    <title id="snippets-arch-title">Smart Snippets architecture with intent classification</title>
    <desc id="snippets-arch-desc">An intent classifier routes the utterance; a semantic cache serves repeat questions directly, otherwise generation draws on curated snippet content. There is no retrieval step.</desc>
    <defs>
        <marker id="snippets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
        </marker>
    </defs>

    <g fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="8" y="84" width="88" height="32" />
        <rect x="152" y="84" width="120" height="32" />
        <rect x="328" y="34" width="140" height="32" />
        <rect x="328" y="134" width="140" height="32" />
        <rect x="540" y="84" width="92" height="32" />
    </g>

    <g font-family="var(--font-mono, monospace)" font-size="12" text-anchor="middle" fill="currentColor">
        <text x="52" y="104">Query</text>
        <text x="212" y="104">Intent classifier</text>
        <text x="398" y="54">Semantic cache hit</text>
        <text x="398" y="154">Snippet generation</text>
        <text x="586" y="104">Response</text>
    </g>

    <g stroke="currentColor" stroke-width="1.5" marker-end="url(#snippets-arrow)">
        <path d="M96,100 L152,100" fill="none" />
        <path d="M272,94 C300,94 300,50 328,50" fill="none" />
        <path d="M272,106 C300,106 300,150 328,150" fill="none" />
        <path d="M468,50 C505,50 505,94 540,96" fill="none" />
        <path d="M468,150 C505,150 505,106 540,104" fill="none" />
    </g>

    <text x="412" y="184" font-family="var(--font-mono, monospace)" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">Evaluated: classification correctness, generation quality, cache correctness</text>
</svg>
