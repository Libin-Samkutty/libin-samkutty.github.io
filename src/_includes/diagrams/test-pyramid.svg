<svg width="480" height="260" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pyramid-title pyramid-desc" class="diagram">
    <title id="pyramid-title">Five testing layers</title>
    <desc id="pyramid-desc">From broadest to narrowest: unit and API tests, contract and integration tests, end-to-end suites, AI evaluation against a golden dataset, and production monitoring of live traffic.</desc>

    <g fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="20" y="8" width="440" height="40" />
        <rect x="50" y="54" width="380" height="40" />
        <rect x="80" y="100" width="320" height="40" />
        <rect x="110" y="146" width="260" height="40" />
        <rect x="140" y="192" width="200" height="40" />
    </g>

    <g font-family="var(--font-mono, monospace)" font-size="13" text-anchor="middle" fill="currentColor">
        <text x="240" y="32">Unit and API tests</text>
        <text x="240" y="78">Contract and integration tests</text>
        <text x="240" y="124">End-to-end suites</text>
        <text x="240" y="170">AI eval vs. golden dataset</text>
        <text x="240" y="216">Production monitoring</text>
    </g>

    <text x="240" y="252" font-family="var(--font-mono, monospace)" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">Widest and fastest at the top; narrowest and slowest at the bottom</text>
</svg>
