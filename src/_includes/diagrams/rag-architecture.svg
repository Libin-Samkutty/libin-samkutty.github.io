<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rag-arch-title rag-arch-desc" class="diagram">
    <title id="rag-arch-title">RAG retrieval architecture</title>
    <desc id="rag-arch-desc">A query is retrieved by dense and sparse search, fused, then used to ground a generated response. Retrieval quality and generation quality are both evaluated.</desc>
    <defs>
        <marker id="rag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor" />
        </marker>
    </defs>

    <g fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="8" y="84" width="88" height="32" />
        <rect x="164" y="34" width="120" height="32" />
        <rect x="164" y="134" width="120" height="32" />
        <rect x="352" y="84" width="120" height="32" />
        <rect x="540" y="84" width="92" height="32" />
    </g>

    <g font-family="var(--font-mono, monospace)" font-size="12" text-anchor="middle" fill="currentColor">
        <text x="52" y="104">Query</text>
        <text x="224" y="54">Dense search</text>
        <text x="224" y="154">Sparse (BM25)</text>
        <text x="412" y="104">Fuse and ground</text>
        <text x="586" y="104">Response</text>
    </g>

    <g stroke="currentColor" stroke-width="1.5" marker-end="url(#rag-arrow)">
        <path d="M96,94 C130,94 130,50 164,50" fill="none" />
        <path d="M96,106 C130,106 130,150 164,150" fill="none" />
        <path d="M284,50 C320,50 320,94 352,94" fill="none" />
        <path d="M284,150 C320,150 320,106 352,106" fill="none" />
        <path d="M472,100 L540,100" fill="none" />
    </g>

    <text x="412" y="184" font-family="var(--font-mono, monospace)" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">Evaluated: context precision, faithfulness, whether the right passage was found</text>
</svg>
