name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already running — a
# half-uploaded Pages artifact is a broken site, not a skipped build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The build generates one Open Graph card per page by rendering them in a
      # real browser, so the build itself needs Chromium — not just the test
      # job. `--with-deps` pulls the shared libraries headless Chromium needs on
      # a bare runner. No `--with-deps` on a cached hit would fail at launch.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # The gates that must hold on the deploy path, not just on the PR. A merge
      # can be green and main can still be broken: two PRs that each pass alone
      # can produce a duplicate title or a dead link once combined, and nothing
      # re-checks that unless the deploy does.
      #
      # Lighthouse is deliberately absent here. It blocks on PRs, where a
      # regression can still be discussed, and would only ever block a merged
      # commit from reaching production over a shared runner's noise.
      - name: Validate HTML
        run: npm run test:html

      - name: Test
        run: npm run test:e2e

      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # The snapshot /tests/ renders, reduced from the run that just happened
      # and uploaded for a person to commit.
      #
      # Deliberately an artifact rather than a commit back to the repository. A
      # workflow that pushes to main on every deploy triggers itself, needs
      # write permission this job does not have, and turns a published figure
      # into something nobody chose to publish. Same reasoning as the visual
      # baselines: the machine produces it, a person accepts it.
      #
      # This is also the only place the snapshot can honestly come from. Run
      # locally on Windows, the visual suite fails against Ubuntu-generated
      # baselines and the reducer would faithfully publish twenty failures that
      # are a font difference rather than a defect. tests/test-report.spec.js
      # rejects a record that did not come from here.
      - name: Record the run for /tests/
        if: always()
        run: npm run test:report
        continue-on-error: true

      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run
          path: src/_data/testRuns.json
          retention-days: 30
          if-no-files-found: warn

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
